<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异形圆角评论卡片 · 可调参数</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #e9edf3;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2633;
  }

  .comment {
    position: relative;
    width: min(480px, 92vw);
    margin: 40px;
  }

  .shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 8px 20px rgba(30, 40, 70, 0.10));
  }
  .shape path { fill: #fff; }

  .avatar {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ff9a8b, #ff6a88);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }

  .content { position: relative; }

  .head { padding: 16px 20px 0 84px; }
  .name { font-size: 16px; font-weight: 600; }
  .meta { margin-top: 4px; font-size: 12px; color: #8a93a3; }

  .body {
    padding: 24px 22px 16px;
    font-size: 14px;
    line-height: 1.7;
  }
  .body p { margin: 0 0 12px; }

  .reply {
    padding: 10px 14px;
    background: #f4f6fa;
    border-radius: 14px 4px 14px 14px;
    font-size: 13px;
    color: #4a5263;
  }
  .reply b { color: #ff6a88; font-weight: 600; }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 22px 16px;
    border-top: 1px dashed #e4e8ef;
    font-size: 12px;
    color: #8a93a3;
  }
  .actions span + span { margin-left: 14px; }

  /* 参数面板 */
  .panel {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 230px;
    padding: 14px 16px 10px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(30, 40, 70, 0.08);
    font-size: 12px;
    color: #4a5263;
  }
  .panel h3 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #8a93a3;
  }
  .row { margin-bottom: 10px; }
  .row .lbl {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .row code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ff6a88;
  }
  .row input {
    width: 100%;
    accent-color: #ff6a88;
  }
</style>
</head>
<body>

<div class="comment" id="comment">
  <svg class="shape" aria-hidden="true">
    <path id="shape"></path>
  </svg>

  <div class="avatar" id="avatar">L</div>

  <div class="content">
    <div class="head" id="head">
      <div class="name">小明同学</div>
      <div class="meta">2 小时前 · 来自 北京</div>
    </div>

    <div class="body">
      <p>这个异形卡片做得挺有意思，头像挖孔的边缘还带圆角过渡，不是生硬的圆形切口。</p>
      <div class="reply"><b>作者回复</b>：左下角面板可以实时调挖孔弧度 ✨</div>
    </div>

    <div class="actions">
      <div><span>👍 128</span><span>💬 24</span></div>
      <div><span>分享</span><span>举报</span></div>
    </div>
  </div>
</div>

<aside class="panel">
  <h3>挖孔参数</h3>
  <div class="row">
    <div class="lbl"><span>弧的弯曲程度</span><code id="v-curve">1.00</code></div>
    <input id="curve" type="range" min="0.55" max="1.8" step="0.01" value="1">
  </div>
  <div class="row">
    <div class="lbl"><span>过渡圆角 fillet</span><code id="v-fillet">10</code></div>
    <input id="fillet" type="range" min="2" max="22" step="1" value="10">
  </div>
  <div class="row">
    <div class="lbl"><span>头像间距 gap</span><code id="v-gap">10</code></div>
    <input id="gap" type="range" min="4" max="26" step="1" value="10">
  </div>
</aside>

<script>
  const CONFIG = {
    avatar: { size: 68, x: 30, y: 30 },   // 头像直径与圆心（相对卡片左上角）
    gap: 10,        // 头像边缘 → 挖孔边缘的净空，直接等于挖孔圆弧半径 – 头像半径
    fillet: 10,     // 挖孔弧与卡片上/左边缘之间的过渡圆角半径
    curve: 1,       // 挖孔弧的弯曲系数：1 = 正圆弧，<1 更平（贴近头像），>1 更鼓
    corner: { tr: 32, br: 8, bl: 20 },    // 其余三角半径，各不相同 → 异形圆角
  };

  // 从 URL 读初始值：?curve=1.4&fillet=14&gap=16
  const q = new URLSearchParams(location.search);
  for (const k of ['curve', 'fillet', 'gap']) {
    if (q.has(k)) CONFIG[k] = parseFloat(q.get(k));
  }
  if (q.get('panel') === '0') {
    document.querySelector('.panel').style.display = 'none';
  }

  const card = document.getElementById('comment');
  const shape = document.getElementById('shape');
  const avatarEl = document.getElementById('avatar');
  const headEl = document.getElementById('head');

  function buildPath(cfg, W, H) {
    const rAv = cfg.avatar.size / 2;
    const cx = cfg.avatar.x;
    const cy = cfg.avatar.y;
    const f = cfg.fillet;
    const r = rAv + cfg.gap;     // 挖孔圆弧半径 —— 调它就是在调弧的弯曲程度
    const d = r + f;             // 过渡圆角的圆心到挖孔圆心的距离
    const { tr, br, bl } = cfg.corner;

    // 两个过渡圆角：圆心分别落在 y=f 与 x=f 上（与直边相切），且与挖孔圆外切
    const fx = Math.min(cx + Math.sqrt(Math.max(d * d - (f - cy) ** 2, 0)), W - tr - 4);
    const fy = Math.min(cy + Math.sqrt(Math.max(d * d - (f - cx) ** 2, 0)), H - bl - 4);

    // 过渡圆角与挖孔弧的切点
    const u1 = { x: (fx - cx) / d, y: (f - cy) / d };
    const u2 = { x: (f - cx) / d, y: (fy - cy) / d };
    const p1 = { x: cx + r * u1.x, y: cy + r * u1.y };
    const p2 = { x: cx + r * u2.x, y: cy + r * u2.y };

    // 挖孔弧：用三次贝塞尔逼近，curve 缩放控制柄长度（端点切线不变 → 衔接依然平滑）
    const phi1 = Math.atan2(p1.y - cy, p1.x - cx);
    const phi2 = Math.atan2(p2.y - cy, p2.x - cx);
    let delta = phi1 - phi2;
    while (delta > 0) delta -= Math.PI * 2;
    const k = Math.abs((4 / 3) * Math.tan(delta / 4) * r) * cfg.curve;
    const t2 = { x: Math.sin(phi2), y: -Math.cos(phi2) };
    const t1 = { x: Math.sin(phi1), y: -Math.cos(phi1) };
    const c1 = { x: p2.x + k * t2.x, y: p2.y + k * t2.y };
    const c2 = { x: p1.x - k * t1.x, y: p1.y - k * t1.y };

    return [
      `M ${fx} 0`,
      `L ${W - tr} 0`,
      `A ${tr} ${tr} 0 0 1 ${W} ${tr}`,
      `L ${W} ${H - br}`,
      `A ${br} ${br} 0 0 1 ${W - br} ${H}`,
      `L ${bl} ${H}`,
      `A ${bl} ${bl} 0 0 1 0 ${H - bl}`,
      `L 0 ${fy}`,
      `A ${f} ${f} 0 0 1 ${p2.x} ${p2.y}`,              // 左下过渡圆角
      `C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${p1.x} ${p1.y}`, // 挖孔弧
      `A ${f} ${f} 0 0 1 ${fx} 0`,                       // 右上过渡圆角
      'Z',
    ].join(' ');
  }

  function render() {
    const W = card.offsetWidth;
    const H = card.offsetHeight;
    const r = CONFIG.avatar.size / 2 + CONFIG.gap;

    shape.setAttribute('d', buildPath(CONFIG, W, H));

    Object.assign(avatarEl.style, {
      left: CONFIG.avatar.x + 'px',
      top: CONFIG.avatar.y + 'px',
      width: CONFIG.avatar.size + 'px',
      height: CONFIG.avatar.size + 'px',
      fontSize: CONFIG.avatar.size * 0.35 + 'px',
    });

    // 文字避让：挖孔最靠右的点在 y = cy 处，x = cx + r
    headEl.style.paddingLeft = (CONFIG.avatar.x + r + 10) + 'px';
  }

  // 面板绑定
  const out = { curve: document.getElementById('v-curve'), fillet: document.getElementById('v-fillet'), gap: document.getElementById('v-gap') };
  for (const key of ['curve', 'fillet', 'gap']) {
    const input = document.getElementById(key);
    input.value = CONFIG[key];
    out[key].textContent = key === 'curve' ? Number(CONFIG[key]).toFixed(2) : CONFIG[key];
    input.addEventListener('input', () => {
      CONFIG[key] = parseFloat(input.value);
      out[key].textContent = key === 'curve' ? CONFIG[key].toFixed(2) : CONFIG[key];
      render();
    });
  }

  new ResizeObserver(render).observe(card);
  render();
</script>

</body>
</html>
