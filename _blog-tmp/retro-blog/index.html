<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的复古博客 - 欢迎来到 Windows 7 时代</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- 桌面图标区域 -->
  <div class="desktop-icons">
    <div class="desktop-icon" data-window="home">
      <div class="icon-image">🏠</div>
      <div class="icon-label">首页</div>
    </div>
    <div class="desktop-icon" data-window="posts">
      <div class="icon-image">📄</div>
      <div class="icon-label">文章列表</div>
    </div>
    <div class="desktop-icon" data-window="gallery">
      <div class="icon-image">🎨</div>
      <div class="icon-label">卡片集</div>
    </div>
    <div class="desktop-icon" data-window="timeline">
      <div class="icon-image">⏰</div>
      <div class="icon-label">时间轴</div>
    </div>
    <div class="desktop-icon" data-window="friends">
      <div class="icon-image">🔗</div>
      <div class="icon-label">友情链接</div>
    </div>
    <div class="desktop-icon" data-window="about">
      <div class="icon-image">ℹ️</div>
      <div class="icon-label">关于我</div>
    </div>
  </div>

  <!-- 窗口容器 -->
  <div id="windows-container"></div>

  <script src="assets/js/window-contents.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
