<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A→B 辐射虚线粒子流</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#060612;
    font-family:"Microsoft YaHei",sans-serif; }
  #c { display:block; width:100vw; height:100vh; }

  /* ---------- 可拖拽圆形手柄 ---------- */
  .handle {
    position:fixed; width:46px; height:46px; border-radius:50%;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:bold; color:#fff; cursor:grab;
    user-select:none; touch-action:none; z-index:20;
    transition:box-shadow .2s;
  }
  .handle:active { cursor:grabbing; }
  #hA { background:radial-gradient(circle at 35% 30%, #7de3ff, #1167a8);
        box-shadow:0 0 14px 4px rgba(80,200,255,.55); }
  #hB { background:radial-gradient(circle at 35% 30%, #ffd37d, #a86a11);
        box-shadow:0 0 14px 4px rgba(255,190,80,.55); }

  /* ---------- 控制面板 ---------- */
  #panel {
    position:fixed; top:14px; left:14px; width:230px; z-index:30;
    background:rgba(18,22,38,.6); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px;
    color:#cfe6ff; font-size:12px; padding:12px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
  }
  #panel h3 { font-size:13px; letter-spacing:2px; margin-bottom:10px; color:#8fd8ff; font-weight:600; }
  .row { margin-bottom:10px; }
  .row label { display:flex; justify-content:space-between; margin-bottom:4px; color:#9db8d8; }
  .row label output { color:#fff; }
  input[type=range] { width:100%; accent-color:#4dc9ff; cursor:pointer; }
  .colors { display:flex; gap:10px; }
  .colors .row { flex:1; }
  input[type=color] { width:100%; height:28px; border:none; border-radius:6px;
    background:none; cursor:pointer; padding:0; }
  #modeTip {
    margin-top:4px; padding:6px 8px; border-radius:8px; text-align:center;
    background:rgba(255,255,255,.07); color:#ffd37d; letter-spacing:1px;
  }
  #help { margin-top:8px; color:#6f8bb0; line-height:1.6; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="handle" id="hA">A</div>
<div class="handle" id="hB">B</div>

<div id="panel">
  <h3>✦ 控制台</h3>
  <div class="colors">
    <div class="row">
      <label>虚线颜色</label>
      <input type="color" id="color" value="#5ad2ff">
    </div>
    <div class="row">
      <label>背景颜色</label>
      <input type="color" id="bg" value="#060612">
    </div>
  </div>
  <div class="row">
    <label>运动快慢 <output id="speedOut">10</output></label>
    <input type="range" id="speed" min="10" max="360" value="10">
  </div>
  <div class="row">
    <label>虚线数量 <output id="countOut">30</output></label>
    <input type="range" id="count" min="10" max="180" value="30">
  </div>
  <div class="row">
    <label>线段粒度 <output id="dashOut">80</output></label>
    <input type="range" id="dash" min="20" max="180" value="80">
  </div>
  <div class="row">
    <label>线条宽度 <output id="widthOut">0.8</output></label>
    <input type="range" id="width" min="0.4" max="1.4" step="0.1" value="0.8">
  </div>
  <div class="row">
    <label>墨迹斑驳 <output id="mottleOut">45</output></label>
    <input type="range" id="mottle" min="0" max="100" value="45">
  </div>
  <div class="row">
    <label>细碎比例 <output id="speckleOut">35</output></label>
    <input type="range" id="speckle" min="0" max="100" value="35">
  </div>
  <div id="modeTip">模式：A → B 辐射</div>
  <div id="help">拖动 <b style="color:#7de3ff">A</b>（起点）、<b style="color:#ffd37d">B</b>（终点）改变方向；<br>两点重合时 → 向四周辐射。</div>
</div>

<script>
(() => {
  const cvs = document.getElementById('c');
  const gl = cvs.getContext('webgl', {
    alpha: false,
    antialias: false,
    powerPreference: 'high-performance'
  });
  const tip = document.getElementById('modeTip');

  if (!gl) {
    tip.textContent = '当前浏览器不支持 WebGL';
    return;
  }

  let W, H, DPR;
  let rafId = 0;
  let lastFrameTime = -Infinity;
  let geometryDirty = true;
  let mode = 0;

  // WebGL keeps the expensive work on the GPU; this cap keeps mobile fill-rate sane.
  const MAX_DPR = 1.5;
  const FRAME_INTERVAL = 1000 / 60;

  /* ---------- 配置 ---------- */
  const cfg = {
    color: '#5ad2ff',
    bg: '#060612',
    speed: 10,
    count: 30,
    dashCount: 80,
    width: 0.8,
    mottle: 0.45,
    speckle: 0.35
  };

  /* ---------- A / B 两点 ---------- */
  const A = { x: innerWidth * 0.15, y: innerHeight * 0.15 };
  const B = { x: innerWidth * 0.85, y: innerHeight * 0.85 };
  const OVERLAP = 26;                    // 小于此距离视为重合 → 四周辐射

  const vertexSource = `
    attribute vec2 aPosition;
    uniform vec2 uResolution;
    varying vec2 vPixel;

    void main() {
      vPixel = (aPosition * 0.5 + 0.5) * uResolution;
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `;

  const fragmentSource = `
    precision highp float;

    varying vec2 vPixel;

    uniform vec2 uResolution;
    uniform vec2 uA;
    uniform vec2 uB;
    uniform vec2 uCenter;
    uniform vec2 uDir;
    uniform vec2 uPerp;
    uniform vec3 uColor;
    uniform vec3 uBg;
    uniform float uTime;
    uniform float uSpeed;
    uniform float uLineCount;
    uniform float uDashCount;
    uniform float uLineWidth;
    uniform float uMottle;
    uniform float uSpeckle;
    uniform float uMode;
    uniform float uSMin;
    uniform float uSpan;
    uniform float uLMin;
    uniform float uLineLength;
    uniform float uRadialLength;

    const float PI = 3.14159265359;
    const float TAU = 6.28318530718;

    float hash(float value) {
      return fract(sin(value * 12.9898) * 43758.5453);
    }

    float localNoise(float local, float seed) {
      float position = local * 6.0;
      float cell = floor(position);
      float blend = smoothstep(0.0, 1.0, fract(position));
      float a = hash(seed + cell * 17.13);
      float b = hash(seed + (cell + 1.0) * 17.13);
      return mix(a, b, blend);
    }

    vec3 dashInfo(float along, float lineId, float totalLength) {
      if (along < 0.0 || along > 1.0) return vec3(0.0);

      float seed = lineId + 1.0;
      float speedMul = mix(0.65, 1.45, hash(seed * 17.13));
      float phasePx = hash(seed * 31.71) * totalLength;
      float motion = -1.0;
      float phase = (motion * uTime * uSpeed * speedMul + phasePx)
        / max(totalLength, 1.0) * uDashCount * 2.0;
      float position = along * uDashCount * 2.0 + phase;
      float cell = floor(position);
      float local = fract(position);
      float segmentSeed = seed * 37.17 + cell * 11.91;

      // Alternate dash/gap cells, with stable random length per segment.
      float parity = mod(cell + floor(hash(seed * 7.37) * 2.0), 2.0);
      float normalLength = mix(0.34, 0.88, hash(segmentSeed * 43.91));
      float shortLength = mix(0.07, 0.30, hash(segmentSeed * 53.17));
      float isShort = step(1.0 - uSpeckle, hash(segmentSeed * 61.73));
      float dashLength = mix(normalLength, shortLength, isShort);
      float isDash = 1.0 - step(0.5, parity);
      float dropout = 1.0
        - step(0.94, hash(segmentSeed * 71.29)) * uMottle * 0.7;
      float ink = mix(
        1.0,
        mix(0.42, 1.08, localNoise(local, segmentSeed * 3.71)),
        uMottle
      );
      float widthJitter = mix(
        1.0,
        mix(0.72, 1.26, hash(segmentSeed * 83.47)),
        uMottle
      );
      float mask = isDash * (1.0 - step(dashLength, local)) * dropout;
      return vec3(mask, ink, widthJitter);
    }

    float lineLight(float distanceToLine, float along, float lineId, float totalLength) {
      vec3 info = dashInfo(along, lineId, totalLength);
      float dash = info.x;
      float ink = info.y;
      float seed = lineId + 1.0;
      float brightness = mix(0.48, 1.0, hash(seed * 5.19));
      float width = uLineWidth
        * mix(0.76, 1.16, hash(seed * 23.47))
        * info.z;
      float core = 1.0 - smoothstep(width, width + 0.9, distanceToLine);
      float glow = exp(-distanceToLine / max(3.5, uLineWidth * 5.5)) * 0.22;
      return dash * brightness * ink * (core + glow);
    }

    float parallelLines(vec2 p) {
      vec2 relative = p - uA;
      float across = dot(relative, uPerp);
      float along = dot(relative, uDir);
      float spacing = uSpan / max(uLineCount, 1.0);
      float normalizedIndex = (across - uSMin) / spacing - 0.5;
      float baseIndex = floor(normalizedIndex + 0.5);
      float alongU = (along - uLMin) / max(uLineLength, 1.0);
      float result = 0.0;

      for (int offset = -1; offset <= 1; offset++) {
        float lineId = clamp(baseIndex + float(offset), 0.0, uLineCount - 1.0);
        float jitter = (hash(lineId * 11.71) - 0.5) * 0.84;
        float lineAcross = uSMin
          + uSpan * ((lineId + 0.5) / max(uLineCount, 1.0))
          + jitter * spacing;
        float distanceToLine = abs(across - lineAcross);
        result = max(result, lineLight(distanceToLine, alongU, lineId, uLineLength));
      }

      return result;
    }

    float radialLines(vec2 p) {
      vec2 relative = p - uCenter;
      float radius = length(relative);
      float angle = atan(relative.y, relative.x);
      if (angle < 0.0) angle += TAU;

      float spacing = TAU / max(uLineCount, 1.0);
      float normalizedIndex = angle / spacing - 0.5;
      float baseIndex = floor(normalizedIndex + 0.5);
      float result = 0.0;

      for (int offset = -1; offset <= 1; offset++) {
        float lineId = mod(baseIndex + float(offset) + uLineCount, uLineCount);
        float jitter = (hash(lineId * 11.71) - 0.5) * 0.04;
        float lineAngle = (lineId + 0.5) / max(uLineCount, 1.0) * TAU + jitter;
        vec2 direction = vec2(cos(lineAngle), sin(lineAngle));
        float forward = dot(relative, direction);
        float distanceToLine = abs(relative.x * direction.y - relative.y * direction.x);
        float radialU = radius / max(uRadialLength, 1.0);
        if (forward >= 0.0) {
          result = max(result, lineLight(distanceToLine, radialU, lineId, uRadialLength));
        }
      }

      return result;
    }

    void main() {
      float light = uMode < 0.5
        ? parallelLines(vPixel)
        : radialLines(vPixel);
      vec3 color = clamp(uBg + uColor * light, 0.0, 1.0);
      gl_FragColor = vec4(color, 1.0);
    }
  `;

  function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || 'WebGL shader compile failed');
    }
    return shader;
  }

  function createProgram(vertex, fragment) {
    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertex));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || 'WebGL program link failed');
    }
    return program;
  }

  let program;
  try {
    program = createProgram(vertexSource, fragmentSource);
  } catch (error) {
    tip.textContent = 'WebGL 着色器初始化失败';
    console.error(error);
    return;
  }

  gl.useProgram(program);

  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1, 1, -1, -1, 1, 1, 1
  ]), gl.STATIC_DRAW);

  const positionLocation = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(positionLocation);
  gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

  const uniform = name => gl.getUniformLocation(program, name);
  const uniforms = {
    resolution: uniform('uResolution'),
    a: uniform('uA'),
    b: uniform('uB'),
    center: uniform('uCenter'),
    dir: uniform('uDir'),
    perp: uniform('uPerp'),
    color: uniform('uColor'),
    bg: uniform('uBg'),
    time: uniform('uTime'),
    speed: uniform('uSpeed'),
    lineCount: uniform('uLineCount'),
    dashCount: uniform('uDashCount'),
    lineWidth: uniform('uLineWidth'),
    mottle: uniform('uMottle'),
    speckle: uniform('uSpeckle'),
    mode: uniform('uMode'),
    sMin: uniform('uSMin'),
    span: uniform('uSpan'),
    lMin: uniform('uLMin'),
    lineLength: uniform('uLineLength'),
    radialLength: uniform('uRadialLength')
  };

  function hexToRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255
    ];
  }

  function syncStyle() {
    gl.uniform3fv(uniforms.color, hexToRgb(cfg.color));
    gl.uniform3fv(uniforms.bg, hexToRgb(cfg.bg));
    gl.uniform1f(uniforms.speed, cfg.speed);
    gl.uniform1f(uniforms.lineCount, cfg.count);
    gl.uniform1f(uniforms.dashCount, cfg.dashCount);
    gl.uniform1f(uniforms.lineWidth, cfg.width * DPR);
    gl.uniform1f(uniforms.mottle, cfg.mottle);
    gl.uniform1f(uniforms.speckle, cfg.speckle);
  }

  function rebuildGeometry() {
    // DOM coordinates use a top-left origin; WebGL pixels use bottom-left.
    const ax = A.x * DPR, ay = (H - A.y) * DPR;
    const bx = B.x * DPR, by = (H - B.y) * DPR;
    const dx = bx - ax, dy = by - ay;
    const dist = Math.hypot(dx, dy);
    const center = [(ax + bx) / 2, (ay + by) / 2];

    if (dist < OVERLAP * DPR) {
      mode = 1;
      const radialLength = Math.hypot(
        Math.max(center[0], cvs.width - center[0]),
        Math.max(center[1], cvs.height - center[1])
      ) + 60 * DPR;
      gl.uniform2f(uniforms.center, center[0], center[1]);
      gl.uniform1f(uniforms.radialLength, radialLength);
    } else {
      mode = 0;
      const ux = dx / dist, uy = dy / dist;
      const px = -uy, py = ux;

      const corners = [[0, 0], [W * DPR, 0], [0, H * DPR], [W * DPR, H * DPR]];
      let sMin = Infinity, sMax = -Infinity, lMin = Infinity, lMax = -Infinity;
      for (const [x, y] of corners) {
        const rx = x - ax, ry = y - ay;
        const s = rx * px + ry * py;
        const l = rx * ux + ry * uy;
        if (s < sMin) sMin = s; if (s > sMax) sMax = s;
        if (l < lMin) lMin = l; if (l > lMax) lMax = l;
      }
      sMin -= 40; sMax += 40; lMin -= 80; lMax += 80;
      gl.uniform2f(uniforms.a, ax, ay);
      gl.uniform2f(uniforms.b, bx, by);
      gl.uniform2f(uniforms.dir, ux, uy);
      gl.uniform2f(uniforms.perp, px, py);
      gl.uniform1f(uniforms.sMin, sMin);
      gl.uniform1f(uniforms.span, sMax - sMin);
      gl.uniform1f(uniforms.lMin, lMin);
      gl.uniform1f(uniforms.lineLength, lMax - lMin);
    }

    gl.uniform2f(uniforms.a, ax, ay);
    gl.uniform2f(uniforms.b, bx, by);
    gl.uniform2f(uniforms.center, center[0], center[1]);
    gl.uniform1f(uniforms.mode, mode);
    tip.textContent = mode ? '模式：四周辐射 ✺' : '模式：A → B 辐射';
    geometryDirty = false;
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, MAX_DPR);
    W = innerWidth;
    H = innerHeight;
    cvs.width = Math.max(1, Math.round(W * DPR));
    cvs.height = Math.max(1, Math.round(H * DPR));
    gl.viewport(0, 0, cvs.width, cvs.height);
    gl.uniform2f(uniforms.resolution, cvs.width, cvs.height);
    clampHandles();
    geometryDirty = true;
  }

  function frame(now) {
    rafId = 0;
    if (document.hidden) return;
    if (now - lastFrameTime < FRAME_INTERVAL) {
      startAnimation();
      return;
    }
    lastFrameTime = now;

    if (geometryDirty) rebuildGeometry();
    syncStyle();
    gl.uniform1f(uniforms.time, now / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    startAnimation();
  }

  function startAnimation() {
    if (!rafId && !document.hidden) rafId = requestAnimationFrame(frame);
  }

  function stopAnimation() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  /* ---------- 手柄拖拽 ---------- */
  const hA = document.getElementById('hA');
  const hB = document.getElementById('hB');

  function placeHandles() {
    hA.style.left = A.x + 'px'; hA.style.top = A.y + 'px';
    hB.style.left = B.x + 'px'; hB.style.top = B.y + 'px';
  }
  function clampHandles() {
    A.x = Math.min(Math.max(A.x, 10), W - 10);
    A.y = Math.min(Math.max(A.y, 10), H - 10);
    B.x = Math.min(Math.max(B.x, 10), W - 10);
    B.y = Math.min(Math.max(B.y, 10), H - 10);
    placeHandles();
  }

  function makeDraggable(el, pt) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const move = ev => {
        pt.x = Math.min(Math.max(ev.clientX, 10), W - 10);
        pt.y = Math.min(Math.max(ev.clientY, 10), H - 10);
        placeHandles();
        geometryDirty = true;
      };
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  }
  makeDraggable(hA, A);
  makeDraggable(hB, B);

  /* ---------- 面板绑定 ---------- */
  const $ = id => document.getElementById(id);
  $('color').addEventListener('input', e => cfg.color = e.target.value);
  $('bg').addEventListener('input', e => cfg.bg = e.target.value);
  $('speed').addEventListener('input', e => {
    cfg.speed = +e.target.value; $('speedOut').textContent = cfg.speed;
  });
  $('count').addEventListener('input', e => {
    cfg.count = +e.target.value; $('countOut').textContent = cfg.count;
  });
  $('dash').addEventListener('input', e => {
    cfg.dashCount = +e.target.value; $('dashOut').textContent = cfg.dashCount;
  });
  $('width').addEventListener('input', e => {
    cfg.width = +e.target.value; $('widthOut').textContent = cfg.width.toFixed(1);
  });
  $('mottle').addEventListener('input', e => {
    cfg.mottle = +e.target.value / 100; $('mottleOut').textContent = e.target.value;
  });
  $('speckle').addEventListener('input', e => {
    cfg.speckle = +e.target.value / 100; $('speckleOut').textContent = e.target.value;
  });

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopAnimation();
    else {
      lastFrameTime = -Infinity;
      startAnimation();
    }
  });
  resize();
  startAnimation();
})();
</script>
</body>
</html>
