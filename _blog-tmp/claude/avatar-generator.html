<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>头像生成器 - 星辰博客</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .avatar-generator {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .generator-container {
      max-width: 600px;
      width: 100%;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 3rem;
      border: 1px solid var(--border);
    }

    .generator-title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .generate-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .avatar-preview {
      margin-top: 3rem;
      text-align: center;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-preview.show {
      opacity: 1;
      transform: scale(1);
    }

    .avatar-bubble {
      width: 200px;
      height: 200px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .avatar-bubble::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      width: 40%;
      height: 40%;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      filter: blur(20px);
    }

    .avatar-initials {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .avatar-info {
      background: rgba(99, 102, 241, 0.1);
      padding: 1.5rem;
      border-radius: 10px;
      margin-top: 1.5rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      color: var(--text);
      font-family: monospace;
      font-weight: 600;
    }

    .copy-btn {
      margin-top: 1rem;
      padding: 0.6rem 1.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.3s;
    }

    .copy-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pattern-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      opacity: 0.1;
    }
  </style>
</head>
<body>

  <section class="avatar-generator">
    <div class="generator-container">
      <h1 class="generator-title">独特头像生成器</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">
        基于你的信息生成独一无二的泡泡头像
      </p>

      <form id="avatarForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="username" placeholder="输入你的用户名" required>
        </div>

        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" class="form-input" id="email" placeholder="输入你的邮箱" required>
        </div>

        <button type="submit" class="generate-btn">生成头像</button>
      </form>

      <div class="avatar-preview" id="avatarPreview">
        <div class="avatar-bubble" id="avatarBubble">
          <div class="pattern-overlay" id="patternOverlay"></div>
        </div>

        <div class="avatar-info">
          <div class="info-row">
            <span class="info-label">主色调</span>
            <span class="info-value" id="colorValue"></span>
          </div>
          <div class="info-row">
            <span class="info-label">渐变角度</span>
            <span class="info-value" id="angleValue"></span>
          </div>
          <div class="info-row">
            <span class="info-label">唯一标识</span>
            <span class="info-value" id="hashValue"></span>
          </div>
          <button class="copy-btn" onclick="copyAvatarData()">复制配置</button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="social-links">
        <a href="#">GitHub</a>
        <a href="#">Twitter</a>
        <a href="#">Email</a>
      </div>
      <p>&copy; 2026 星辰博客. 用 ❤️ 和代码构建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/avatar-generator.js"></script>
</body>
</html>
