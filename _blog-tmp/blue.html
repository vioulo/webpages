<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克莱因蓝光标效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #002FA7;
            cursor: none;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            background: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8);
        }

        #cursor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6);
            animation: breathe 3.5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6),
                            0 0 10px 5px rgba(255, 215, 0, 0.4),
                            0 0 20px 10px rgba(255, 215, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(255, 215, 0, 0.8),
                            0 0 40px 20px rgba(255, 215, 0, 0.5),
                            0 0 60px 30px rgba(255, 215, 0, 0.3);
            }
        }

        .ray {
            position: fixed;
            transform-origin: left center;
            pointer-events: none;
            z-index: 9998;
            height: 0;
            border-top-style: solid;
            border-top-color: #FFD700;
        }
    </style>
</head>
<body>
    <div id="cursor"></div>

    <script>
        const cursor = document.getElementById('cursor');
        const body = document.body;

        let cursorX = window.innerWidth * 0.85;
        let cursorY = window.innerHeight * 0.35;
        let velocityX = 0;
        let velocityY = 0;
        let lastX = cursorX;
        let lastY = cursorY;
        let rayRotation = 0;

        cursor.style.left = cursorX + 'px';
        cursor.style.top = cursorY + 'px';

        const rays = [];
        const maxRays = 12;
        const raySpeed = 2;

        function createRay(x, y, angle) {
            const ray = document.createElement('div');
            ray.className = 'ray';

            const length = Math.random() * 100 + 40;
            const opacity = Math.random() * 0.4 + 0.6;
            const width = Math.random() * 2 + 1.5;
            const isDashed = Math.random() > 0.5;

            ray.style.left = x + 'px';
            ray.style.top = y + 'px';
            ray.style.width = length + 'px';
            ray.style.borderTopWidth = width + 'px';
            ray.style.opacity = opacity;
            ray.style.transform = `rotate(${angle}deg)`;
            ray.style.borderTopStyle = isDashed ? 'dashed' : 'solid';

            body.appendChild(ray);

            setTimeout(() => {
                ray.remove();
            }, 80);
        }

        function updateRays(x, y, isMoving) {
            if (isMoving) {
                rayRotation += raySpeed;

                for (let i = 0; i < maxRays; i++) {
                    const angle = (360 / maxRays) * i + rayRotation;
                    createRay(x, y, angle);
                }
            }
        }

        let lastRayTime = 0;
        const rayInterval = 30;

        function handleBounce() {
            const cursorRadius = 15;
            const damping = 0.7;
            const bounceForce = 15;

            if (cursorX - cursorRadius <= 0) {
                cursorX = cursorRadius;
                velocityX = Math.abs(velocityX) * damping + bounceForce;
                velocityY *= 0.9;
            }
            if (cursorX + cursorRadius >= window.innerWidth) {
                cursorX = window.innerWidth - cursorRadius;
                velocityX = -Math.abs(velocityX) * damping - bounceForce;
                velocityY *= 0.9;
            }
            if (cursorY - cursorRadius <= 0) {
                cursorY = cursorRadius;
                velocityY = Math.abs(velocityY) * damping + bounceForce;
                velocityX *= 0.9;
            }
            if (cursorY + cursorRadius >= window.innerHeight) {
                cursorY = window.innerHeight - cursorRadius;
                velocityY = -Math.abs(velocityY) * damping - bounceForce;
                velocityX *= 0.9;
            }
        }

        document.addEventListener('mousemove', (e) => {
            const targetX = e.clientX;
            const targetY = e.clientY;

            velocityX = (targetX - cursorX) * 0.15;
            velocityY = (targetY - cursorY) * 0.15;

            cursorX = targetX;
            cursorY = targetY;
        });

        function animate() {
            cursorX += velocityX;
            cursorY += velocityY;

            handleBounce();

            const deltaX = cursorX - lastX;
            const deltaY = cursorY - lastY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const isMoving = distance > 0.5;

            const now = Date.now();
            if (isMoving && now - lastRayTime > rayInterval) {
                updateRays(cursorX, cursorY, true);
                lastRayTime = now;
            }

            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';

            velocityX *= 0.95;
            velocityY *= 0.95;

            lastX = cursorX;
            lastY = cursorY;

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            const cursorRadius = 15;
            if (cursorX > window.innerWidth - cursorRadius) {
                cursorX = window.innerWidth - cursorRadius;
            }
            if (cursorY > window.innerHeight - cursorRadius) {
                cursorY = window.innerHeight - cursorRadius;
            }
        });
    </script>
</body>
</html>
