<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>block</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    main {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wind {
      width: 500px;
      height: 200px;
      border: 1px solid #e3e3e3;
      border-radius: 30px;
    }
    .wind:hover {
      background: #4e5ef1;
      border-color: #4e5ef1;
    }
  </style>
</head>
<body>
  <main>
    <div class="wind">
    </div>
  </main>

</body>
</html>
