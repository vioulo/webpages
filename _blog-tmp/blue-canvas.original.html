<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克莱因蓝光标效果 - Canvas版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #002FA7;
            cursor: none;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let cursorX = canvas.width * 0.85;
        let cursorY = canvas.height * 0.35;
        let velocityX = 0;
        let velocityY = 0;
        let lastX = cursorX;
        let lastY = cursorY;
        let rayRotation = 0;

        const rays = [];
        const maxRays = 12;
        const raySpeed = 2;
        const cursorRadius = 15;

        let breathePhase = 0;

        class Ray {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.length = Math.random() * 100 + 40;
                this.width = Math.random() * 2 + 1.5;
                this.opacity = Math.random() * 0.4 + 0.6;
                this.isDashed = Math.random() > 0.5;
                this.life = 5;
                this.maxLife = 5;
            }

            update() {
                this.life--;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);

                ctx.strokeStyle = `rgba(255, 215, 0, ${this.opacity})`;
                ctx.lineWidth = this.width;

                if (this.isDashed) {
                    ctx.setLineDash([6, 4]);
                } else {
                    ctx.setLineDash([]);
                }

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(this.length, 0);
                ctx.stroke();

                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

        function createRays(x, y) {
            for (let i = 0; i < maxRays; i++) {
                const angle = (360 / maxRays) * i + rayRotation;
                rays.push(new Ray(x, y, angle));
            }
            rayRotation += raySpeed;
        }

        function drawCursor(isMoving) {
            if (!isMoving) {
                breathePhase += 0.03;
            }
            const breatheScale = Math.sin(breathePhase) * 0.5 + 0.5;

            ctx.save();
            ctx.translate(cursorX, cursorY);

            const baseGlowRadius = 40;
            const maxGlowRadius = isMoving ? baseGlowRadius : (baseGlowRadius + breatheScale * 20);
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, maxGlowRadius);

            const glowIntensity = isMoving ? 0.3 : (0.5 + breatheScale * 0.3);

            gradient.addColorStop(0, `rgba(255, 215, 0, ${glowIntensity * 0.8})`);
            gradient.addColorStop(0.2, `rgba(255, 215, 0, ${glowIntensity * 0.6})`);
            gradient.addColorStop(0.4, `rgba(255, 215, 0, ${glowIntensity * 0.4})`);
            gradient.addColorStop(0.6, `rgba(255, 215, 0, ${glowIntensity * 0.2})`);
            gradient.addColorStop(0.8, `rgba(255, 215, 0, ${glowIntensity * 0.1})`);
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, maxGlowRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, cursorRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function handleBounce() {
            const damping = 0.7;
            const bounceForce = 15;

            if (cursorX - cursorRadius <= 0) {
                cursorX = cursorRadius;
                velocityX = Math.abs(velocityX) * damping + bounceForce;
                velocityY *= 0.9;
            }
            if (cursorX + cursorRadius >= canvas.width) {
                cursorX = canvas.width - cursorRadius;
                velocityX = -Math.abs(velocityX) * damping - bounceForce;
                velocityY *= 0.9;
            }
            if (cursorY - cursorRadius <= 0) {
                cursorY = cursorRadius;
                velocityY = Math.abs(velocityY) * damping + bounceForce;
                velocityX *= 0.9;
            }
            if (cursorY + cursorRadius >= canvas.height) {
                cursorY = canvas.height - cursorRadius;
                velocityY = -Math.abs(velocityY) * damping - bounceForce;
                velocityX *= 0.9;
            }
        }

        document.addEventListener('mousemove', (e) => {
            const targetX = e.clientX;
            const targetY = e.clientY;

            velocityX = (targetX - cursorX) * 0.15;
            velocityY = (targetY - cursorY) * 0.15;

            cursorX = targetX;
            cursorY = targetY;
        });

        let lastRayTime = 0;
        const rayInterval = 100;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cursorX += velocityX;
            cursorY += velocityY;

            handleBounce();

            const deltaX = cursorX - lastX;
            const deltaY = cursorY - lastY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const isMoving = distance > 0.1;

            const now = Date.now();
            if (isMoving && distance > 0.5 && now - lastRayTime > rayInterval) {
                createRays(cursorX, cursorY);
                lastRayTime = now;
            }

            for (let i = rays.length - 1; i >= 0; i--) {
                rays[i].update();
                rays[i].draw();
                if (rays[i].isDead()) {
                    rays.splice(i, 1);
                }
            }

            drawCursor(isMoving);

            velocityX *= 0.95;
            velocityY *= 0.95;

            lastX = cursorX;
            lastY = cursorY;

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            if (cursorX > canvas.width - cursorRadius) {
                cursorX = canvas.width - cursorRadius;
            }
            if (cursorY > canvas.height - cursorRadius) {
                cursorY = canvas.height - cursorRadius;
            }
        });
    </script>
</body>
</html>
