<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克莱因蓝光标效果 - 修复优化版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #002FA7;
            cursor: none;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 🎛️ 控制面板样式 */
        #controlPanel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 30, 80, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 14px;
            padding: 16px;
            width: 340px;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        #controlPanel h3 {
            color: #FFD700;
            font-size: 14px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #controlPanel h3::before { content: "⚙️"; }

        .section-title {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            margin: 14px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .style-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .style-tab {
            padding: 5px 9px;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 52px;
        }
        .style-tab .en { font-size: 9px; opacity: 0.7; margin-top: 2px; }
        .style-tab:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.6);
            color: #fff;
        }
        .style-tab.active {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-color: #FFD700;
            color: #002FA7;
            font-weight: 600;
            box-shadow: 0 3px 12px rgba(255, 215, 0, 0.45);
            transform: translateY(-1px);
        }
        .style-tab.active .en { color: #002FA7; opacity: 0.9; }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 8px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .toggle-group label {
            font-size: 11px;
            color: rgba(255,255,255,0.9);
            flex: 1;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 24px;
            transition: 0.3s;
            border: 1px solid rgba(255,215,0,0.3);
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 2px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-color: #FFD700;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
            background: #002FA7;
        }

        .color-section {
            margin: 12px 0;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }
        .color-row label {
            font-size: 11px;
            color: rgba(255,255,255,0.85);
            min-width: 55px;
        }
        .color-picker-wrapper {
            position: relative;
            width: 32px; height: 32px;
        }
        .color-picker-wrapper input[type="color"] {
            position: absolute;
            width: 100%; height: 100%;
            border: none; border-radius: 50%;
            cursor: pointer; background: transparent;
            padding: 0; opacity: 0;
        }
        .color-preview {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.6);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .color-palette {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .palette-color {
            width: 24px; height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .palette-color:hover {
            transform: scale(1.15);
            border-color: rgba(255,255,255,0.6);
        }
        .palette-color.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px #002FA7, 0 2px 10px rgba(255,215,0,0.5);
        }

        .panel-footer {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 215, 0, 0.25);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
            display: flex;
            justify-content: space-between;
        }
        .panel-footer kbd {
            background: rgba(255, 215, 0, 0.25);
            padding: 2px 7px;
            border-radius: 4px;
            color: #FFD700;
            font-weight: 500;
        }
        .hint {
            font-size: 9px;
            color: rgba(255,215,0,0.7);
            margin-top: 4px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="controlPanel">
        <h3>效果控制面板</h3>

        <div class="section-title">✨ 射线样式</div>
        <div class="style-tabs" id="styleTabs"></div>

        <div class="section-title">🎨 颜色设置</div>
        <div class="color-section">
            <div class="color-row">
                <label>光标颜色</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="cursorColorPicker" value="#FFD700">
                    <div class="color-preview" id="cursorColorPreview"></div>
                </div>
            </div>
            <div class="color-row">
                <label>射线颜色</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="rayColorPicker" value="#FFD700">
                    <div class="color-preview" id="rayColorPreview"></div>
                </div>
            </div>
            <div class="color-palette" id="rayPalette"></div>
            <div class="hint">💡 点击色板快速切换射线配色方案</div>
        </div>

        <div class="section-title">⚙️ 光标样式</div>
        <div class="toggle-group">
            <label>立体光影效果</label>
            <label class="toggle-switch">
                <input type="checkbox" id="cursor3dToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="panel-footer">
            <span><kbd>Tab</kbd> 切换样式</span>
            <span><kbd>G</kbd> 射线间隙</span>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // === 🎛️ 核心配置区 ===
    let rayStyle = 'sharp';
    let rayColorPalette = ['#FFD700', '#fff', '#FF0055', '#00FF99', '#00CCFF'];
    let cursorColor = '#FFD700';
    let rayColor = '#FFD700';
    let cursorStyle = '3d';  // 'flat' | '3d'

    let rayGapEnabled = false;
    const rayGap = 15;
    const cursorRadius = 15;
    const maxRays = 12;
    const raySpeed = 2;
    const rayInterval = 100;
    // ==============================

    let cursorX = canvas.width * 0.85;
    let cursorY = canvas.height * 0.35;
    let velocityX = 0, velocityY = 0;
    let lastX = cursorX, lastY = cursorY;
    let rayRotation = 0;
    let breathePhase = 0;

    const styleList = [
        'sharp','round','square','taper','pulse','wave','block',
        'gradient','ribbon','spark','cone','neon',
        'dashedCurve', 'growingCurve', 'triangle', 'rootGrow'
    ];

    const styleNames = {
        sharp: '锐利直线', round: '圆润线条', square: '方头线段', taper: '渐变消散',
        pulse: '呼吸脉冲', wave: '波浪曲线', block: '块状分段',
        gradient: '彩虹渐变', ribbon: '流光缎带', spark: '粒子火花',
        cone: '三角锥光', neon: '霓虹发光',
        dashedCurve: '虚实曲线', growingCurve: '扩散生长',
        triangle: '三角阵列', rootGrow: '根部生长'
    };

    let styleIndex = styleList.indexOf(rayStyle);

    const styleConfig = {
        sharp:   { type: 'line', lineCap: 'butt' },
        round:   { type: 'line', lineCap: 'round' },
        square:  { type: 'line', lineCap: 'square' },
        taper:   { type: 'taper', lineCap: 'round' },
        pulse:   { type: 'pulse', lineCap: 'round' },
        wave:    { type: 'wave' },
        block:   { type: 'block' },
        gradient:{ type: 'gradient' },
        ribbon:  { type: 'ribbon' },
        spark:   { type: 'spark' },
        cone:    { type: 'cone' },
        neon:    { type: 'neon', lineCap: 'round' },
        dashedCurve:  { type: 'dashedCurve', lineCap: 'round' },
        growingCurve: { type: 'growingCurve', lineCap: 'round' },
        triangle:     { type: 'triangle' },
        rootGrow:     { type: 'rootGrow', lineCap: 'round' }
    };

    function getColorWithAlpha(colorStr, alpha) {
        if (!colorStr) return `rgba(255, 215, 0, ${alpha})`;
        if (/^#[0-9A-Fa-f]{6}$/.test(colorStr)) {
            return `rgba(${parseInt(colorStr.slice(1,3),16)},${parseInt(colorStr.slice(3,5),16)},${parseInt(colorStr.slice(5,7),16)},${alpha})`;
        }
        if (/^#[0-9A-Fa-f]{3}$/.test(colorStr)) {
            return `rgba(${parseInt(colorStr[1]+colorStr[1],16)},${parseInt(colorStr[2]+colorStr[2],16)},${parseInt(colorStr[3]+colorStr[3],16)},${alpha})`;
        }
        return colorStr;
    }

    function getRandomColor() {
        if (rayColorPalette.length === 0) return rayColor;
        if (rayColorPalette.length === 1) return rayColorPalette[0];
        return Math.random() > 0.3 ? rayColor : rayColorPalette[Math.floor(Math.random() * rayColorPalette.length)];
    }

    const rays = [];
    class Ray {
        constructor(x, y, angle) {
            this.x = x; this.y = y; this.angle = angle;
            // 🔧 增加基础长度，确保生长效果可见
            this.length = Math.random() * 120 + 60;  // 原 40-140 → 60-180
            this.width = Math.random() * 2 + 1.5;
            this.opacity = Math.random() * 0.4 + 0.6;
            this.isDashed = Math.random() > 0.5;
            this.life = 6; this.maxLife = 6;  // 🔧 延长寿命
            this.pulsePhase = Math.random() * Math.PI * 2;
            this.waveFreq = 0.08 + Math.random() * 0.04;
            this.waveAmp = 3 + Math.random() * 4;
            this.blockCount = Math.floor(4 + Math.random() * 3);
            this.sparkCount = Math.floor(6 + Math.random() * 5);
            this.coneEndWidth = this.width * 4;
            this.growthProgress = 0;
            this.growthSpeed = 0.035 + Math.random() * 0.025;  // 🔧 加快生长
            this.rootGrowth = 0;
            this.rootSpeed = 0.025 + Math.random() * 0.02;     // 🔧 加快根部生长
            this.rootCurve = Math.random() > 0.5 ? 1 : -1;
            this.color = getRandomColor();
        }

        update(cx, cy) {
            this.x = cx; this.y = cy; this.life--;
            if (this.growthProgress < 1) this.growthProgress += this.growthSpeed;
            if (this.rootGrowth < 1) this.rootGrowth += this.rootSpeed;
        }

        draw(cfg, globalTime) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate((this.angle * Math.PI) / 180);
            const startX = rayGapEnabled ? (cursorRadius + rayGap) : 0;
            const drawLength = Math.max(0, this.length - startX);
            let currentOpacity = this.opacity;
            if (cfg.type === 'pulse') {
                const p = Math.sin(globalTime * 0.01 + this.pulsePhase) * 0.3 + 0.7;
                currentOpacity *= p;
            }

            switch (cfg.type) {
                case 'spark':       this._drawSpark(startX, drawLength, currentOpacity, globalTime); break;
                case 'block':       this._drawBlock(startX, drawLength, currentOpacity, globalTime); break;
                case 'ribbon':      this._drawRibbon(startX, drawLength, currentOpacity, globalTime); break;
                case 'wave':        this._drawWave(startX, drawLength, currentOpacity, globalTime); break;
                case 'gradient':    this._drawGradient(startX, drawLength, currentOpacity, globalTime); break;
                case 'cone':        this._drawCone(startX, drawLength, currentOpacity, globalTime); break;
                case 'neon':        this._drawNeon(startX, drawLength, currentOpacity, globalTime); break;
                case 'dashedCurve': this._drawDashedCurve(startX, drawLength, currentOpacity, globalTime); break;
                case 'growingCurve':this._drawGrowingCurve(startX, drawLength, currentOpacity, globalTime); break;
                case 'triangle':    this._drawTriangle(startX, drawLength, currentOpacity, globalTime); break;
                case 'rootGrow':    this._drawRootGrow(startX, drawLength, currentOpacity, globalTime); break;
                default: this._drawDefault(startX, drawLength, currentOpacity, cfg);
            }
            ctx.restore();
        }

        _drawDefault(startX, length, alpha, cfg) {
            ctx.lineCap = cfg.lineCap || 'butt';
            ctx.lineWidth = this.width;
            ctx.setLineDash(this.isDashed ? [6, 4] : []);
            let len = length;
            if (cfg.type === 'taper') {
                const baseColor = getColorWithAlpha(this.color, alpha);
                const grad = ctx.createLinearGradient(startX, 0, startX + len, 0);
                grad.addColorStop(0, baseColor);
                grad.addColorStop(1, getColorWithAlpha(this.color, 0));
                ctx.strokeStyle = grad;
            } else {
                ctx.strokeStyle = getColorWithAlpha(this.color, alpha);
            }
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(startX + len, 0); ctx.stroke();
        }

        _drawWave(startX, length, alpha, time) {
            const steps = 30, stepLen = length / steps;
            const color = getColorWithAlpha(this.color, alpha);
            ctx.strokeStyle = color; ctx.lineWidth = this.width * 1.2;
            ctx.shadowColor = getColorWithAlpha(this.color, 0.5); ctx.shadowBlur = 8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(startX, 0);
            for (let i = 1; i <= steps; i++) {
                const x = startX + i * stepLen;
                const y = Math.sin((x - startX) * this.waveFreq + time * 0.005 + this.pulsePhase) * this.waveAmp;
                ctx.lineTo(x, y);
            }
            ctx.stroke(); ctx.shadowBlur = 0;
        }

        _drawBlock(startX, length, alpha, time) {
            const segLen = length / this.blockCount, gapSize = 3;
            const p = Math.sin(time * 0.008 + this.pulsePhase) * 0.2 + 0.9;
            for (let i = 0; i < this.blockCount; i++) {
                const bx = startX + i * segLen + gapSize, bw = segLen - gapSize * 2;
                if (bw <= 0) continue;
                const a = alpha * (i % 2 === 0 ? 1 : 0.5) * p;
                ctx.fillStyle = getColorWithAlpha(this.color, a);
                ctx.fillRect(bx, -this.width / 2, bw, this.width);
            }
        }

        _drawRibbon(startX, length, alpha, time) {
            const w = this.width * 3.5, twist = Math.sin(time * 0.005 + this.pulsePhase) * 0.15;
            const endX = startX + length;
            ctx.fillStyle = getColorWithAlpha(this.color, alpha * 0.35);
            ctx.beginPath();
            ctx.moveTo(startX, -w/2); ctx.lineTo(endX, -w/2 * (1 + twist));
            ctx.lineTo(endX, w/2 * (1 - twist)); ctx.lineTo(startX, w/2); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = getColorWithAlpha('#FFFFFF', alpha * 0.6); ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(startX, -w/2+1); ctx.lineTo(endX, -w/2*(1+twist)+1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(startX, w/2-1); ctx.lineTo(endX, w/2*(1-twist)-1); ctx.stroke();
        }

        _drawSpark(startX, length, alpha, time) {
            const count = this.sparkCount, baseSize = this.width * 1.2;
            for (let i = 0; i < count; i++) {
                const t = i / (count - 1), x = startX + t * length;
                const flicker = Math.sin(time * 0.02 + this.pulsePhase + i) * 0.2 + 0.6;
                const s = baseSize * (0.5 + t * 0.6) * flicker;
                const a = alpha * (1 - t * 0.7) * flicker * 0.85;
                ctx.fillStyle = getColorWithAlpha(this.color, a * 0.6);
                ctx.beginPath(); ctx.arc(x, 0, s * 1.8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = getColorWithAlpha('#FFF', a * 0.7);
                ctx.beginPath(); ctx.arc(x, 0, s * 0.5, 0, Math.PI * 2); ctx.fill();
            }
        }

        _drawGradient(startX, length, alpha, time) {
            const len = length * (Math.sin(time * 0.008 + this.pulsePhase) * 0.15 + 0.92);
            const grad = ctx.createLinearGradient(startX, 0, startX + len, 0);
            if (rayColorPalette.length >= 2) {
                const c1 = getColorWithAlpha(this.color, alpha);
                const c2 = getColorWithAlpha(rayColorPalette[(rayColorPalette.indexOf(this.color) + 1) % rayColorPalette.length] || this.color, alpha * 0.5);
                grad.addColorStop(0, c1); grad.addColorStop(1, c2);
            } else {
                const c = getColorWithAlpha(this.color, alpha);
                grad.addColorStop(0, c); grad.addColorStop(1, getColorWithAlpha(this.color, 0.1));
            }
            ctx.strokeStyle = grad; ctx.lineWidth = this.width * 1.3; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(startX + len, 0); ctx.stroke();
        }

        _drawCone(startX, length, alpha, time) {
            if (length <= 0) return;
            const p = Math.sin(time * 0.01 + this.pulsePhase) * 0.15 + 0.92;
            const endX = startX + length, endW = this.coneEndWidth * p;
            const grad = ctx.createLinearGradient(startX, 0, endX, 0);
            grad.addColorStop(0, getColorWithAlpha(this.color, alpha * 0.9));
            grad.addColorStop(1, getColorWithAlpha(this.color, alpha * 0.3));
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(endX, -endW / 2); ctx.lineTo(endX, endW / 2); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = getColorWithAlpha('#FFFFFF', alpha * 0.7); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(endX, -endW / 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(endX, endW / 2); ctx.stroke();
        }

        _drawNeon(startX, length, alpha, time) {
            const col = getColorWithAlpha(this.color, alpha);
            ctx.strokeStyle = col; ctx.lineWidth = this.width; ctx.lineCap = 'round';
            ctx.shadowColor = col; ctx.shadowBlur = 15;
            ctx.beginPath(); ctx.moveTo(startX, 0); ctx.lineTo(startX + length, 0); ctx.stroke();
            ctx.shadowBlur = 0;
        }

        _drawDashedCurve(startX, length, alpha, time) {
            const steps = 25, stepLen = length / steps;
            const color = getColorWithAlpha(this.color, alpha);
            ctx.strokeStyle = color; ctx.lineWidth = this.width; ctx.lineCap = 'round';

            ctx.beginPath(); ctx.moveTo(startX, 0);
            for (let i = 1; i <= steps; i++) {
                const x = startX + i * stepLen;
                const offset = x - startX;
                const y = Math.sin(offset * 0.06 + time * 0.003 + this.pulsePhase) * 4;

                if (i % 3 === 0) {
                    ctx.lineTo(x, y);
                    ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
                } else {
                    ctx.setLineDash([7, 6]);
                    ctx.lineDashOffset = -time * 0.04;
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke(); ctx.setLineDash([]);
        }

        // 🔧🔧🔧 修复：扩散生长 - 水泡效果 + 舒展曲线
        // 🆕 从内向外生长的曲线段
        _drawGrowingCurve(startX, length, alpha, time) {
            const steps = 30;
            const color = getColorWithAlpha(this.color, alpha);

            ctx.strokeStyle = color;
            ctx.lineWidth = this.width * 1.1;
            ctx.lineCap = 'round';
            // 生长末端添加光晕
            ctx.shadowColor = getColorWithAlpha(this.color, alpha * 0.8);
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.moveTo(startX, 0);

            // 🔧 根据 growthProgress 控制绘制长度
            const currentLength = length * Math.min(1, this.growthProgress);
            const activeSteps = Math.floor(steps * this.growthProgress);

            for (let i = 1; i <= activeSteps; i++) {
                const t = i / steps;
                const x = startX + t * currentLength;
                // 螺旋+波浪复合曲线
                const spiral = Math.sin(t * Math.PI * 2) * t * 8;
                const wave = Math.sin(t * 15 + time * 0.01) * 3;
                const y = spiral + wave;
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 🔧 生长末端亮点
            if (this.growthProgress > 0.1 && this.growthProgress < 1) {
                const endT = this.growthProgress;
                const endX = startX + endT * length;
                const endY = Math.sin(endT * Math.PI * 2) * endT * 8 + Math.sin(endT * 15 + time * 0.01) * 3;
                const glowSize = 4 + Math.sin(time * 0.02) * 2;
                ctx.fillStyle = getColorWithAlpha('#FFF', alpha * 0.9);
                ctx.beginPath();
                ctx.arc(endX, endY, glowSize, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // 🔧🔧🔧 修复：根部生长 - 可见性 + 生长动感
        _drawRootGrow(startX, length, alpha, time) {
            const color = getColorWithAlpha(this.color, alpha);
            const progress = Math.min(1, this.rootGrowth);

            // 🔧 根部光晕（生长起点）- 更明显
            if (progress > 0.03) {
                const rootGlow = ctx.createRadialGradient(startX, 0, 0, startX, 0, 20);
                rootGlow.addColorStop(0, getColorWithAlpha(this.color, alpha * 0.6 * (1 - progress * 0.3)));
                rootGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = rootGlow;
                ctx.beginPath(); ctx.arc(startX, 0, 20, 0, Math.PI * 2); ctx.fill();
            }

            ctx.strokeStyle = color;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 0;  // 🔧 关闭模糊，用渐变替代

            ctx.beginPath(); ctx.moveTo(startX, 0);

            // 🔧 增加分段，曲线更流畅
            const segments = 35;
            for (let i = 1; i <= segments * progress; i++) {
                const t = i / segments;  // 0~1
                const x = startX + t * length;

                // 🔧🔧 增大曲线偏移，生长轨迹更明显
                const mainCurve = Math.sin(t * Math.PI * 1.2) * 25 * this.rootCurve;  // 🔧 15→25
                const jitter = Math.sin(t * 30 + time * 0.025) * (2 - t * 1.5);       // 🔧 增大抖动
                const growthWave = Math.sin(t * 10 + time * 0.015) * t * 5;           // 🔧 3→5
                const y = mainCurve + jitter + growthWave;

                // 🔧 线宽渐变：根部粗→末端细（更明显）
                ctx.lineWidth = this.width * (1.5 - t * 1.0);  // 🔧 增大变化范围
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 🔧 生长末端嫩芽 - 更清晰可见
            if (progress > 0.15 && progress < 1) {
                const endT = progress;
                const endX = startX + endT * length;
                const endY = Math.sin(endT * Math.PI * 1.2) * 25 * this.rootCurve
                           + Math.sin(endT * 30 + time * 0.025) * (2 - endT * 1.5)
                           + Math.sin(endT * 10 + time * 0.015) * endT * 5;

                // 嫩芽核心亮点
                ctx.fillStyle = getColorWithAlpha('#FFF', alpha * 0.98);
                ctx.beginPath(); ctx.arc(endX, endY, 4, 0, Math.PI * 2); ctx.fill();

                // 嫩芽光晕（水泡感）
                const budGlow = ctx.createRadialGradient(endX, endY, 0, endX, endY, 22);
                budGlow.addColorStop(0, getColorWithAlpha(this.color, alpha * 0.7));
                budGlow.addColorStop(0.5, getColorWithAlpha(this.color, alpha * 0.25));
                budGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = budGlow;
                ctx.beginPath(); ctx.arc(endX, endY, 22, 0, Math.PI * 2); ctx.fill();
            }
        }

        // 🔧 三角阵列：边框调细
        _drawTriangle(startX, length, alpha, time) {
            const triangles = Math.floor(length / 18) + 2;
            const triSize = this.width * 2.5;
            const color = getColorWithAlpha(this.color, alpha);

            ctx.strokeStyle = color;
            ctx.lineWidth = this.width * 0.5;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';

            for (let i = 0; i < triangles; i++) {
                const t = i / triangles;
                const baseX = startX + t * length;
                const direction = i % 2 === 0 ? 1 : -1;
                const pulse = Math.sin(time * 0.015 + this.pulsePhase + i * 0.5) * 0.2 + 0.9;

                ctx.beginPath();
                ctx.moveTo(baseX, 0);
                ctx.lineTo(baseX + triSize * 0.6 * pulse, -triSize * 0.8 * direction * pulse);
                ctx.lineTo(baseX + triSize * 1.2 * pulse, 0);
                ctx.closePath();
                ctx.stroke();

                ctx.fillStyle = getColorWithAlpha(this.color, alpha * 0.08);
                ctx.fill();
            }
        }

        isDead() { return this.life <= 0; }
    }

    function createRays(x, y) {
        for (let i = 0; i < maxRays; i++) {
            const angle = (360 / maxRays) * i + rayRotation;
            rays.push(new Ray(x, y, angle));
        }
        rayRotation += raySpeed;
    }

    // 🔧🔧🔧 修复：光标立体效果 - 细腻渐变 + 精致高光
    function drawCursor(isMoving) {
        if (!isMoving) breathePhase += 0.03;
        const breatheScale = Math.sin(breathePhase) * 0.5 + 0.5;
        const glowR = isMoving ? 28 : 28 + breatheScale * 12;
        const int = isMoving ? 0.25 : 0.4 + breatheScale * 0.25;

        ctx.save(); ctx.translate(cursorX, cursorY);

        // 呼吸光晕
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
        g.addColorStop(0, getColorWithAlpha(cursorColor, int * 0.9));
        g.addColorStop(0.5, getColorWithAlpha(cursorColor, int * 0.4));
        g.addColorStop(1, getColorWithAlpha(cursorColor, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();

        if (cursorStyle === '3d') {
            // 🔧🔧 5层细腻渐变模拟球体光影
            const bodyGrad = ctx.createRadialGradient(-4, -4, 0, 0, 0, cursorRadius);
            bodyGrad.addColorStop(0, 'rgba(255,255,255,0.55)');     // 🔧 高光更柔和
            bodyGrad.addColorStop(0.25, getColorWithAlpha(cursorColor, 1));
            bodyGrad.addColorStop(0.55, getColorWithAlpha(cursorColor, 0.92));
            bodyGrad.addColorStop(0.85, getColorWithAlpha(cursorColor, 0.78));
            bodyGrad.addColorStop(1, getColorWithAlpha(cursorColor, 0.65));  // 🔧 边缘过渡更自然
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.arc(0, 0, cursorRadius, 0, Math.PI * 2); ctx.fill();

            // 🔧 高光：椭圆 + 柔和边缘
            ctx.save();
            ctx.translate(-3.5, -3.5);
            const highlightGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, cursorRadius * 0.45);
            highlightGrad.addColorStop(0, 'rgba(255,255,255,0.5)');
            highlightGrad.addColorStop(0.7, 'rgba(255,255,255,0.15)');
            highlightGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = highlightGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, cursorRadius * 0.42, cursorRadius * 0.35, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 🔧 边缘暗部：更细腻的阴影
            ctx.strokeStyle = getColorWithAlpha('#000', 0.12);
            ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(0, 0, cursorRadius - 0.8, 0, Math.PI * 2); ctx.stroke();

        } else {
            // 扁平效果
            ctx.fillStyle = cursorColor;
            ctx.beginPath(); ctx.arc(0, 0, cursorRadius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = getColorWithAlpha('#FFF', 0.5);
            ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(0, 0, cursorRadius - 1, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
    }

    function handleBounce() {
        const d=0.7, b=15;
        if(cursorX<cursorRadius){cursorX=cursorRadius;velocityX=Math.abs(velocityX)*d+b;velocityY*=0.9;}
        if(cursorX>canvas.width-cursorRadius){cursorX=canvas.width-cursorRadius;velocityX=-Math.abs(velocityX)*d-b;velocityY*=0.9;}
        if(cursorY<cursorRadius){cursorY=cursorRadius;velocityY=Math.abs(velocityY)*d+b;velocityX*=0.9;}
        if(cursorY>canvas.height-cursorRadius){cursorY=canvas.height-cursorRadius;velocityY=-Math.abs(velocityY)*d-b;velocityX*=0.9;}
    }

    // === 🎛️ UI 控制面板逻辑 ===
    function initControlPanel() {
        const tabsContainer = document.getElementById('styleTabs');
        const cursorColorPicker = document.getElementById('cursorColorPicker');
        const rayColorPicker = document.getElementById('rayColorPicker');
        const cursorColorPreview = document.getElementById('cursorColorPreview');
        const rayColorPreview = document.getElementById('rayColorPreview');
        const cursor3dToggle = document.getElementById('cursor3dToggle');
        const paletteContainer = document.getElementById('rayPalette');

        styleList.forEach((style, idx) => {
            const tab = document.createElement('div');
            tab.className = `style-tab${style === rayStyle ? ' active' : ''}`;
            tab.dataset.style = style;
            tab.innerHTML = `<span>${styleNames[style]}</span><span class="en">${style}</span>`;
            tab.addEventListener('click', () => {
                styleIndex = idx; rayStyle = style; updateActiveTab();
            });
            tabsContainer.appendChild(tab);
        });

        cursorColorPicker.value = cursorColor;
        rayColorPicker.value = rayColor;
        updateColorPreview();

        cursorColorPicker.addEventListener('input', (e) => { cursorColor = e.target.value; updateColorPreview(); });
        rayColorPicker.addEventListener('input', (e) => {
            rayColor = e.target.value;
            rayColorPalette[0] = rayColor;
            updateColorPreview(); updatePalette();
        });

        cursor3dToggle.checked = (cursorStyle === '3d');
        cursor3dToggle.addEventListener('change', (e) => { cursorStyle = e.target.checked ? '3d' : 'flat'; });

        function updatePalette() {
            paletteContainer.innerHTML = '';
            rayColorPalette.forEach((color, idx) => {
                const swatch = document.createElement('div');
                swatch.className = `palette-color${idx === 0 && color === rayColor ? ' active' : ''}`;
                swatch.style.background = color;
                swatch.addEventListener('click', () => {
                    rayColor = color; rayColorPicker.value = color;
                    if (idx === 0) rayColorPalette = [color, '#fff', '#FF0055', '#00FF99', '#00CCFF'];
                    updatePalette(); updateColorPreview();
                });
                paletteContainer.appendChild(swatch);
            });
        }
        updatePalette();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') { e.preventDefault(); styleIndex = (styleIndex + 1) % styleList.length; rayStyle = styleList[styleIndex]; updateActiveTab(); }
            if (e.key.toLowerCase() === 'g') { rayGapEnabled = !rayGapEnabled; }
        });

        function updateActiveTab() {
            document.querySelectorAll('.style-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.style === rayStyle);
            });
        }
        function updateColorPreview() {
            cursorColorPreview.style.background = cursorColor;
            rayColorPreview.style.background = rayColor;
        }
    }

    document.addEventListener('mousemove', e => {
        velocityX = (e.clientX - cursorX) * 0.15;
        velocityY = (e.clientY - cursorY) * 0.15;
        cursorX = e.clientX; cursorY = e.clientY;
    });

    let lastRayTime = 0;
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        cursorX += velocityX; cursorY += velocityY;
        handleBounce();
        const dist = Math.hypot(cursorX - lastX, cursorY - lastY);
        const isMoving = dist > 0.1;
        const now = Date.now();

        if (isMoving && dist > 0.5 && now - lastRayTime > rayInterval) {
            createRays(cursorX, cursorY); lastRayTime = now;
        }

        const cfg = styleConfig[rayStyle];
        for (let i = rays.length - 1; i >= 0; i--) {
            rays[i].update(cursorX, cursorY);
            rays[i].draw(cfg, now);
            if (rays[i].isDead()) rays.splice(i, 1);
        }

        drawCursor(isMoving);
        velocityX *= 0.95; velocityY *= 0.95;
        lastX = cursorX; lastY = cursorY;
        requestAnimationFrame(animate);
    }

    initControlPanel();
    animate();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        if(cursorX > canvas.width - cursorRadius) cursorX = canvas.width - cursorRadius;
        if(cursorY > canvas.height - cursorRadius) cursorY = canvas.height - cursorRadius;
    });
</script>
</body>
